<!doctype html>
<html lang="ja" data-root="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1221" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="理科・算数ラボ">
<title>理科・算数ラボ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="css/common.css">
<style>
.menu{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.menu h1{font-family:var(--f-head);font-weight:900;font-size:28px;margin:6px 0 2px;letter-spacing:.02em}
.menu .lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.menu h2{font-family:var(--f-head);font-size:18px;margin:18px 0 8px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-decoration:none}
a.item:active{background:var(--surface2)}
.item svg{flex:none;width:52px;height:52px}
.item .t{flex:1;min-width:0}
.item .n{display:block;font-family:var(--f-head);font-weight:900;font-size:19px;line-height:1.35}
.item .d{display:block;font-size:14px;color:var(--muted);line-height:1.45}
.item .go{flex:none;font-size:22px;color:var(--muted)}
.item.soon{opacity:.55}
.item.soon .go{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="menu">
  <h1>理科・算数ラボ</h1>
  <p class="lead">見たいものをえらんでね。指で動かして調べられます。</p>

  <h2>理科</h2>
  <div class="list">
    <a class="item" href="moon/">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#0d1530"/><circle cx="26" cy="26" r="15" fill="#3a4258"/><path d="M26 11a15 15 0 0 1 0 30a8 15 0 0 0 0-30z" fill="#f5efd6"/></svg>
      <span class="t"><span class="n">月の満ち欠け</span><span class="d">太陽・地球・月を動かして、月の形の変わり方を調べる</span></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="item" href="shadow/">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#8cc4ee"/><rect y="34" width="52" height="18" fill="#cfc3a0"/><circle cx="14" cy="14" r="7" fill="#ffc62e"/><path d="M30 20v15" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/><path d="M30 35l14 6" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" opacity=".75"/><circle cx="30" cy="20" r="2.4" fill="#d9482b"/></svg>
      <span class="t"><span class="n">太陽とかげ</span><span class="d">時刻・季節・場所を変えて、かげの向きと長さを調べる</span></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <div class="item soon" aria-disabled="true">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#e6eaf3"/><rect x="9" y="20" width="20" height="12" rx="2" fill="#586379"/><rect x="29" y="23" width="3" height="6" fill="#586379"/><circle cx="40" cy="22" r="6" fill="#ffd23f"/><path d="M40 28v8" stroke="#586379" stroke-width="2"/></svg>
      <span class="t"><span class="n">電気の回路</span><span class="d">電池と電球のつなぎ方で、電流の大きさを調べる</span></span>
      <span class="go">準備中</span>
    </div>
    <div class="item soon" aria-disabled="true">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#e6eaf3"/><path d="M8 24h36" stroke="#586379" stroke-width="3" stroke-linecap="round"/><path d="M26 25l-6 14h12z" fill="#586379"/><rect x="10" y="26" width="6" height="8" fill="#d98a06"/><rect x="36" y="26" width="6" height="5" fill="#d98a06"/></svg>
      <span class="t"><span class="n">てこ（天びん）</span><span class="d">おもりの重さと位置で、つり合いを調べる</span></span>
      <span class="go">準備中</span>
    </div>
  </div>

  <h2>算数</h2>
  <div class="list">
    <div class="item soon" aria-disabled="true">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="#e6eaf3"/><path d="M14 18l10-6h16v20l-10 6H14z" fill="none" stroke="#586379" stroke-width="2"/><path d="M14 18h16v20M30 18l10-6" fill="none" stroke="#586379" stroke-width="2"/><path d="M14 30l26-12" stroke="#d98a06" stroke-width="2.5"/></svg>
      <span class="t"><span class="n">立体の切断（断面図）</span><span class="d">立方体を切ったときの切り口を調べる</span></span>
      <span class="go">準備中</span>
    </div>
  </div>

  <p class="foot">ホーム画面に追加すると、アプリのように全画面で使えます。一度、電波のある所で月・太陽とかげを開いておくと、次からは電波がなくても使えます。</p>
</main>
<div id="update" class="update" hidden><span>新しい版があります。</span><button id="updateBtn" type="button">開き直す</button></div>
<script src="js/common.js"></script>
</body>
</html>
